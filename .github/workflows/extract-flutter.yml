name: Extract Flutter Project

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project ZIP to repository root
        run: |
          set -e
          ZIP="LearnComputerBasic-master.zip"
          test -f "$ZIP"
          rm -rf /tmp/flutter_project
          mkdir -p /tmp/flutter_project
          unzip -q -o "$ZIP" -d /tmp/flutter_project

          ROOT="/tmp/flutter_project/LearnComputerBasic-master"
          if [ ! -d "$ROOT" ]; then
            ROOT="$(find /tmp/flutter_project -maxdepth 2 -type f -name pubspec.yaml -print -quit | xargs -r dirname)"
          fi
          test -f "$ROOT/pubspec.yaml"

          # Copy everything from the project root directly into this repository.
          cp -a "$ROOT"/. .
          rm -f "$ZIP"

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Extract Flutter project into repository root"
          git push origin HEAD:main
