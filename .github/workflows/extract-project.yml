name: Extract Flutter Project

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract all project files to repository root
        shell: bash
        run: |
          set -e
          ZIP="LearnComputerBasic-master.zip"
          test -f "$ZIP"
          rm -rf /tmp/flutter-project
          mkdir -p /tmp/flutter-project
          unzip -q "$ZIP" -d /tmp/flutter-project

          PUBSPEC="$(find /tmp/flutter-project -type f -name pubspec.yaml | head -n 1)"
          test -n "$PUBSPEC"
          ROOT_DIR="$(dirname "$PUBSPEC")"
          echo "Flutter project root: $ROOT_DIR"

          # Put every file/folder inside the Flutter project directly at repo root.
          cp -a "$ROOT_DIR"/. ./
          rm -f "$ZIP"

      - name: Commit extracted project
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Extract Flutter project files to repository root"
          git push
