name: Extract Flutter Project

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project to repository root
        shell: bash
        run: |
          set -e
          ZIP="LearnComputerBasic-master.zip"
          test -f "$ZIP"
          rm -rf /tmp/flutter-project
          mkdir -p /tmp/flutter-project
          unzip -q "$ZIP" -d /tmp/flutter-project
          ROOT_DIR="$(find /tmp/flutter-project -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$ROOT_DIR"
          cp -a "$ROOT_DIR"/. ./
          rm -f "$ZIP"
          rm -f .github/workflows/extract-project.yml

      - name: Commit extracted project
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Extract Flutter project to repository root"
          git push
